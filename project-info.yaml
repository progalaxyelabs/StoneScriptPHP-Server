# Project information: StoneScriptPHP Server (application skeleton)
# `composer create-project progalaxyelabs/stonescriptphp-server my-api`

project:
  name: StoneScriptPHP Server
  version: 5.0.0
  description: |
    Application skeleton for PostgreSQL-backed REST APIs on the StoneScriptPHP framework.
    Secure by default: it refuses to boot with a missing required setting, ships typed-auth
    for every AUTH_MODE, keeps the signing key out of images, and starts with strict
    persistence and hydration settings.
  homepage: https://stonescriptphp.org
  repository: https://github.com/progalaxyelabs/StoneScriptPHP-Server
  documentation: https://stonescriptphp.org/docs
  license: MIT
  authors:
    - name: StoneScriptPHP Team
      email: team@progalaxyelabs.com
      homepage: https://stonescriptphp.org

technology:
  language: PHP
  language_version: ">=8.5.12"
  framework: StoneScriptPHP
  framework_version: "^14.0.1"
  framework_repository: https://github.com/progalaxyelabs/StoneScriptPHP
  database: PostgreSQL, reached only through the StoneScriptDB Gateway (the API never opens a database connection itself)
  authentication: JWT (RSA); auth modes builtin | external | hybrid
  container: Docker (php:8.5.12-fpm-bookworm + nginx + supervisor, port 8000)
  package_manager: Composer
  testing_framework: PHPUnit ^11.0

structure:
  public: index.php, the single entry point (calls Application::run)
  src/config: application.php (what index.php runs), routes.php, auth.php, allowed-origins.php, jwt-excluded-paths.php, subscription.php
  src/App: AppEnv.php (typed environment), Routes/ (IRouteHandler classes)
  src/postgresql/main/postgresql: tables/ and functions/ (SQL; the layout gateway:register-main requires)
  tests: bootstrap.php (throwaway test environment) and Unit/
  docker: nginx and supervisor configs used by Dockerfile.dev and Dockerfile.prod
  scripts: post-create-project.php (creates .env and the JWT keypair)

cli:
  entry_point: php stone
  commands:
    - php stone setup --quiet                  # non-interactive; generates the JWT keypair, leaves an existing .env alone
    - php stone env:check                      # pre-flight: required settings present
    - php stone auth:check-origins             # sign-in origin listed in src/config/allowed-origins.php
    - php stone generate route <METHOD> <path>
    - php stone generate model <function>.pgsql
    - php stone generate client --tenancy=T1|T2|T3
    - php stone generate jwt
    - php stone generate auth:email-password | auth:google | auth:linkedin | auth:apple | auth:api-key
    - php stone validate sqlintegrity
    - php stone gateway:register-main
    - php stone gateway:migrate-main
    - php stone gateway:migrate-vendor-main --list | --only=<Name>
    - php stone migrate status
    - php stone test

development:
  prerequisites:
    - PHP >= 8.5.12 with openssl
    - Composer
    - A StoneScriptDB Gateway to point DB_GATEWAY_URL at
    - Docker (optional)
  run:
    - composer dev                                         # Dockerfile.dev, http://localhost:8000
    - php -S 127.0.0.1:9100 -t public public/index.php     # built-in server, development only
  test: composer test

dependencies:
  runtime:
    - progalaxyelabs/stonescriptphp: ^14.0.1
  development:
    - phpunit/phpunit: ^11.0
    - phpstan/phpstan: ^2.1

configuration:
  environment: .env (copied from .env.example; every key is read by the framework)
  required_when_gateway:
    - DB_GATEWAY_URL
    - DB_GATEWAY_PLATFORM
    - JWT_ISSUER
  required_when_external_or_hybrid:
    - AUTH_SERVICE_URL
    - AUTH_ISSUER
    - PLATFORM_CODE
  cors: src/config/allowed-origins.php (an ALLOWED_ORIGINS variable would override it)
  reverse_proxy: TRUSTED_PROXIES

security:
  - Required settings left empty in .env.example, so a forgotten value stops the boot
  - Signing keys and .env are excluded from images (.dockerignore) and from archives
  - Fails closed on origins: none listed means none allowed
  - Strict persistence contract and strict row hydration by default
  - Subscription module off by default

deployment:
  image: Dockerfile.prod (multi-stage, OPcache, runs as www-data)
  details: DOCKER.md

maintenance:
  framework_updates: composer update progalaxyelabs/stonescriptphp
  versioning: semantic; the skeleton's major tracks the framework major it requires

support:
  issues: https://github.com/progalaxyelabs/StoneScriptPHP-Server/issues
  discussions: https://github.com/progalaxyelabs/StoneScriptPHP/discussions
