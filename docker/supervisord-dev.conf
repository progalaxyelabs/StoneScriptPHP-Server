[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info

[program:php-fpm]
command=/usr/local/bin/dev-fpm-user.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=1

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=2

[program:startup-message]
command=/bin/sh -c 'echo "" && echo "🚀 StoneScriptPHP Development Server" && echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" && echo "✓ PHP-FPM ready on port 9000" && echo "✓ Nginx ready on port 8000" && echo "✓ Server running at http://localhost:8000" && echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" && echo ""'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
autorestart=false
startsecs=0
priority=999
